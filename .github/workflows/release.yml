name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag whose release should receive the package
        required: true

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Build package
        run: bash build_deb.sh

      - name: Attach package to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.deb dist/*.sha256 --clobber
